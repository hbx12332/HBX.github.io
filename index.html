<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f5f7;
    }
    .card {
      background: #ffffff;
      padding: 48px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #555555; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，我是【HBX】</h1>
    <p>这是我亲手做的第一个网站，<br>
       它已经正式上线，全世界都打得开。</p>
  </div>
</body>
</html>
